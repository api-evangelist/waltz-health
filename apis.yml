name: Waltz Health
description: 'Waltz Health is a Chicago-based digital health company founded in 2021 by Mark Thierer
  (former CEO of OptumRx and Catamaran) and Jonathon Thierer, building AI-driven prescription drug
  pricing marketplaces that help consumers, payers, pharmacy benefit managers, pharmacies, and
  self-insured employers make better-informed, lower-cost decisions on prescription care. Its
  Marketplace Search product is a multi-card search engine that compares medication prices across
  every major discount and savings program, and Waltz Connect is an end-to-end solution that lowers
  the cost of specialty medications through a network of national and regional specialty pharmacies
  that compete on price and clinical outcomes. The company raised a $35M Series A led by GV and, in
  August 2025, merged with EVERSANA to form a combined pharmaceutical commercialization and drug-access
  platform, with Mark Thierer appointed CEO of EVERSANA. Waltz Health has no public developer API
  program; this profile captures company identity and live domain-security posture.'
